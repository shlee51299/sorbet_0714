<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Sorbet 게시판</title>
    <link rel="stylesheet" href="/css/common.css"> <!-- 공통 스타일 -->
    <link rel="stylesheet" href="/css/main.css">   <!-- 메인 페이지 전용 스타일 -->
</head>
<body>

<!-- 상단 네비게이션 -->
<div class="top-nav">
    <a href="/">홈</a>
    <a href="/about">소개</a>
    <a href="/login">로그인</a>
</div>

<!-- 메인 레이아웃: 사이드바 + 콘텐츠 -->
<div class="layout">

    <!-- 좌측 카테고리 사이드바 -->
    <aside class="sidebar">
        <h2>카테고리</h2>
        <button class="nav-btn active" data-category="all">전체</button>
        <button class="nav-btn" data-category="love">연애</button>
        <button class="nav-btn" data-category="friend">친구</button>
        <button class="nav-btn" data-category="saju">사주</button>
        <button class="nav-btn" data-category="life">인생</button>
        <button class="nav-btn" data-category="etc">기타</button>
    </aside>

    <!-- 우측 게시글 목록 영역 -->
    <main class="content">
        <div class="post-box" th:each="post : ${posts}">
            <div class="category" th:text="${post.category}">카테고리</div>
            <a th:href="@{|/posts/${post.id}|}" th:text="${post.title}">제목</a>
        </div>
    </main>

</div>

<!-- 고정 글쓰기 버튼 -->
<button class="btn-write" onclick="location.href='/create'">글쓰기</button>

<!-- 버튼 활성화 스크립트 -->
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const navs = document.querySelectorAll('.nav-btn');
        navs.forEach(btn => {
            btn.addEventListener('click', () => {
                navs.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                const category = btn.dataset.category;
                console.log('선택된 카테고리:', category);
                // TODO: 필터링 기능 구현 가능
            });
        });
    });
</script>

</body>
</html>
