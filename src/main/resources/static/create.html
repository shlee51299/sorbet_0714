<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>글쓰기 - Sorbet 게시판</title>
  <link rel="stylesheet" href="/css/common.css">
  <link rel="stylesheet" href="/css/create.css">
</head>
<body>
<div class="container">
  <h1 class="page-title">글 작성</h1>

  <form action="/view.html" method="get" class="form-box">
    <label for="title">제목</label>
    <input type="text" id="title" name="title" required class="full-width-input">

    <label for="content">내용</label>
    <textarea id="content" name="content" rows="10" required class="full-width-textarea"></textarea>

    <label for="tags">태그 선택</label>
    <div class="custom-select-wrapper">
      <div class="selected-tags-display" id="customTagsDisplay">
        태그를 선택하세요
      </div>
      <div class="options-container" id="customTagsOptions">
        <div class="option-item" data-value="연애">연애</div>
        <div class="option-item" data-value="친구">친구</div>
        <div class="option-item" data-value="사주">사주</div>
        <div class="option-item" data-value="인생">인생</div>
        <div class="option-item" data-value="기타">기타</div>
      </div>
      <input type="hidden" name="selectedTags" id="hiddenSelectedTags">
    </div>

    <button type="submit" class="btn-submit">등록하기</button>
  </form>
</div>

<script>
  const display = document.getElementById('customTagsDisplay');
  const optionsContainer = document.getElementById('customTagsOptions');
  const optionItems = optionsContainer.querySelectorAll('.option-item');
  const hiddenInput = document.getElementById('hiddenSelectedTags');
  let selectedValues = [];

  // 클릭 상자를 클릭하면 옵션 목록의 가시성을 토글합니다.
  display.addEventListener('click', () => {
    optionsContainer.classList.toggle('show');
  });

  // 각 옵션 항목의 클릭 이벤트를 처리합니다.
  optionItems.forEach(item => {
    item.addEventListener('click', () => {
      const value = item.getAttribute('data-value');
      const index = selectedValues.indexOf(value);

      if (index > -1) {
        // 이미 선택되어 있으면 선택 해제
        selectedValues.splice(index, 1);
        item.classList.remove('selected');
      } else {
        // 선택되지 않았으면 선택
        selectedValues.push(value);
        item.classList.add('selected');
      }
      updateDisplay();
    });
  });

  // 드롭다운 외부를 클릭하면 드롭다운을 닫습니다.
  document.addEventListener('click', (event) => {
    if (!event.target.closest('.custom-select-wrapper') && !event.target.closest('.selected-tags-display')) {
      optionsContainer.classList.remove('show');
    }
  });

  function updateDisplay() {
    if (selectedValues.length === 0) {
      display.textContent = '태그를 선택하세요';
    } else {
      display.textContent = selectedValues.join(', ');
    }
    hiddenInput.value = selectedValues.join(',');
  }
</script>
</body>
</html>
